name: Omni Neural Core (experimental)

on:
  pull_request:
    branches: [main]
    paths:
      - 'neural-core/**'
      - 'neural-android/**'
      - 'scripts/prepare_neural_android_fixtures.sh'
      - 'scripts/prepare_bilingual_refusal.py'
      - 'scripts/test_bilingual_refusal.py'
      - 'scripts/train_bilingual_refusal.sh'
      - 'scripts/train_multi_intent.sh'
      - 'scripts/train_rich_text.sh'
      - 'scripts/prepare_fresh_intent_eval.py'
      - 'scripts/test_rich_text_data.py'
      - 'scripts/prepare_massive_refusal.py'
      - 'scripts/test_massive_refusal.py'
      - 'scripts/train_public_refusal.sh'
      - 'scripts/train_public_decision.sh'
      - 'scripts/reserve_residual_eval.py'
      - 'scripts/test_residual_data.py'
      - 'scripts/train_residual_adapter.sh'
      - 'scripts/reserve_utility_eval.py'
      - 'scripts/test_utility_data.py'
      - 'scripts/train_utility_expert.sh'
      - 'scripts/train_prototype_support.sh'
      - 'scripts/train_expert_trust.sh'
      - 'scripts/reserve_trust_eval.py'
      - 'scripts/test_trust_data.py'
      - 'scripts/prepare_prototype_challenges.py'
      - 'scripts/test_prototype_data.py'
      - '.github/scripts/run-neural-android-tests.sh'
      - '.github/scripts/neural-emulator-cleanup.sh'
      - 'scripts/test_neural_emulator_cleanup.py'
      - 'scripts/test_neural_training.sh'
      - 'scripts/import_clinc_rejection.py'
      - 'settings.gradle.kts'
      - '.github/workflows/neural-core-ci.yml'
  push:
    branches: [main]
    paths:
      - 'neural-core/**'
      - 'neural-android/**'
      - 'scripts/prepare_neural_android_fixtures.sh'
      - 'scripts/prepare_bilingual_refusal.py'
      - 'scripts/test_bilingual_refusal.py'
      - 'scripts/train_bilingual_refusal.sh'
      - 'scripts/train_multi_intent.sh'
      - 'scripts/train_rich_text.sh'
      - 'scripts/prepare_fresh_intent_eval.py'
      - 'scripts/test_rich_text_data.py'
      - 'scripts/prepare_massive_refusal.py'
      - 'scripts/test_massive_refusal.py'
      - 'scripts/train_public_refusal.sh'
      - 'scripts/train_public_decision.sh'
      - 'scripts/reserve_residual_eval.py'
      - 'scripts/test_residual_data.py'
      - 'scripts/train_residual_adapter.sh'
      - 'scripts/reserve_utility_eval.py'
      - 'scripts/test_utility_data.py'
      - 'scripts/train_utility_expert.sh'
      - 'scripts/train_prototype_support.sh'
      - 'scripts/train_expert_trust.sh'
      - 'scripts/reserve_trust_eval.py'
      - 'scripts/test_trust_data.py'
      - 'scripts/prepare_prototype_challenges.py'
      - 'scripts/test_prototype_data.py'
      - '.github/scripts/run-neural-android-tests.sh'
      - '.github/scripts/neural-emulator-cleanup.sh'
      - 'scripts/test_neural_emulator_cleanup.py'
      - 'scripts/test_neural_training.sh'
      - 'scripts/import_clinc_rejection.py'
      - 'settings.gradle.kts'
      - '.github/workflows/neural-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-compat:
    name: Java 8 compatibility + isolated smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile without Python or Android tooling
        run: |
          mkdir -p /tmp/omni-neural-classes
          javac --release 8 -encoding UTF-8 -d /tmp/omni-neural-classes \
            neural-core/src/main/java/com/omnidev/workspace/domain/neural/*.java \
            neural-core/smoke/NeuralPrototypeSmoke.java
          java -cp /tmp/omni-neural-classes NeuralPrototypeSmoke
      - name: Verify isolated module with JUnit
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers 1 :neural-core:test --stacktrace
      - name: Train numerical fixtures and verify portable checkpoints
        run: bash scripts/test_neural_training.sh
      - name: Verify Android fixture generation and host contract
        run: bash scripts/prepare_neural_android_fixtures.sh /tmp/omni-android-fixtures
      - name: Verify bilingual corpus guards and train six bounded candidates
        run: |
          python3 scripts/test_neural_emulator_cleanup.py
          python3 scripts/test_bilingual_refusal.py
          bash scripts/train_bilingual_refusal.sh
      - name: Upload experimental bilingual checkpoint and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bilingual-refusal-${{ github.run_id }}
          path: build/bilingual-refusal-v1/
          if-no-files-found: ignore
          retention-days: 30
      - name: Train independent domain-presence heads and verify compiled exports
        run: bash scripts/train_multi_intent.sh
      - name: Upload multi-intent experiment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-intent-${{ github.run_id }}
          path: build/multi-intent/
          if-no-files-found: ignore
          retention-days: 30

  rich-text-training:
    name: Rich text training + fused checkpoint parity
    needs: java-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify fresh evaluation guards and train fused presence candidates
        run: |
          python3 scripts/test_rich_text_data.py
          bash scripts/train_rich_text.sh
      - name: Upload rich checkpoint, vocabulary and measured evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rich-text-${{ github.run_id }}
          path: build/rich-text/
          if-no-files-found: ignore
          retention-days: 30

  public-bilingual-training:
    name: Public Arabic-English training + checkpoint parity
    needs: java-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify public provenance, train four bounded fits and check exports
        run: |
          python3 scripts/test_massive_refusal.py
          bash scripts/train_public_refusal.sh
          bash scripts/train_public_decision.sh
      - name: Upload public experiment evidence, including failed quality gates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-bilingual-${{ github.run_id }}
          path: |
            build/public-refusal/
            build/public-decision/
          if-no-files-found: ignore
          retention-days: 30

  residual-training:
    name: Bounded residual training + preservation evidence
    needs: java-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify reservation, train six candidates and compare compiled checkpoints
        run: |
          python3 scripts/test_residual_data.py
          bash scripts/train_residual_adapter.sh
      - name: Upload residual evidence including the selected zero-gain policy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: residual-adapter-${{ github.run_id }}
          path: build/residual-adapter/
          if-no-files-found: ignore
          retention-days: 30

  utility-training:
    name: Utility-aware AdamW training + expert policy integrity
    needs: java-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify data, real optimizer gradients, four refits and compiled policies
        run: |
          python3 scripts/test_utility_data.py
          bash scripts/train_utility_expert.sh
      - name: Upload utility weights and complete quality-regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: utility-expert-${{ github.run_id }}
          path: build/utility-expert-v2/
          if-no-files-found: ignore
          retention-days: 30

  prototype-training:
    name: Bounded prototype fit + retention evidence
    needs: java-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify authored provenance, real-row fitter and exported/committed policies
        run: |
          python3 scripts/test_prototype_data.py
          bash scripts/train_prototype_support.sh
      - name: Upload support bank and complete quality-regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prototype-support-${{ github.run_id }}
          path: build/prototype-support/
          if-no-files-found: ignore
          retention-days: 30

  expert-trust-training:
    name: Counterfactual trust training + fixed-base integrity
    needs: java-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify reservation, counterfactual labels, four fits and compiled checkpoints
        run: |
          python3 scripts/test_trust_data.py
          bash scripts/train_expert_trust.sh
      - name: Upload learned selector and complete quality-regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expert-trust-${{ github.run_id }}
          path: build/expert-trust/
          if-no-files-found: ignore
          retention-days: 30

  android-runtime:
    name: Experimental neural ART parity (API 30)
    needs: java-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-30;google_apis;x86_64'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise standalone test APK and collect descriptive emulator timings
        env:
          CI_GRADLE_JVMARGS: '-Xmx2g -Dfile.encoding=UTF-8'
          NEURAL_BENCHMARK: 'true'
        run: bash .github/scripts/run-neural-android-tests.sh --emulator
      - name: Upload ART evidence and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neural-art-api30-${{ github.run_id }}
          path: |
            neural-android/build/reports/**
            neural-android/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14
