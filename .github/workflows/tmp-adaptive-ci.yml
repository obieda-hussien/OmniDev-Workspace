name: Temporary Adaptive Mode Diagnostics

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feature/adaptive-mode-brain-v3 ]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Compile Lite debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers 2 :app:compileLiteDebugKotlin --stacktrace
      - name: Run adaptive router unit test
        run: ./gradlew --no-daemon --max-workers 2 :app:testLiteDebugUnitTest --tests 'com.omnidev.workspace.domain.engine.AdaptiveModeRouterTest' --stacktrace
