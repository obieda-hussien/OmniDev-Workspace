name: Android CI/CD Pipeline (Manual Backup)

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build release APKs"
        required: false
        default: true
        type: boolean

concurrency:
  group: android-manual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  manual-android-ci:
    name: Manual Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Compile, test, lint, and build debug flavors
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:lintLiteDebug \
            :app:lintNormDebug \
            :app:lintProDebug \
            :app:lintOemDebug \
            :app:lintAdminDebug \
            :app:testLiteDebugUnitTest \
            :app:testNormDebugUnitTest \
            :app:testProDebugUnitTest \
            :app:testOemDebugUnitTest \
            :app:testAdminDebugUnitTest \
            :app:assembleLiteDebug \
            :app:assembleNormDebug \
            :app:assembleProDebug \
            :app:assembleOemDebug \
            :app:assembleAdminDebug \
            --continue

      - name: Build release flavors
        if: inputs.build_release == true
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:assembleLiteRelease \
            :app:assembleNormRelease \
            :app:assembleProRelease \
            :app:assembleOemRelease \
            :app:assembleAdminRelease \
            --continue

      - name: Upload APKs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: manual-apks-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 7
