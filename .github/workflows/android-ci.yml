name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/tools-dev-bugfix ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main, develop, feature/tools-dev-bugfix ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed release APK"
        required: false
        default: false
        type: boolean
      enable_extended_checks:
        description: "Enable additional compile checks"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.incremental=false"
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: false

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle + native build dirs
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
            ~/.cmake
          key: quality-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            quality-${{ runner.os }}-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run lint checks
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Optional static-analysis tasks (if present)
        continue-on-error: true
        run: |
          TASKS="$(./gradlew tasks --all --no-daemon --console=plain)"
          if echo "$TASKS" | grep -qE '^ktlintCheck( |$)'; then
            ./gradlew --no-daemon ktlintCheck
          else
            echo "ktlintCheck task not found; skipping."
          fi
          if echo "$TASKS" | grep -qE '^detekt( |$)'; then
            ./gradlew --no-daemon detekt
          else
            echo "detekt task not found; skipping."
          fi

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run compile + unit tests
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

      - name: Optional extended checks
        if: github.event_name == 'workflow_dispatch' && inputs.enable_extended_checks == true
        run: |
          ./gradlew --no-daemon :app:compileReleaseKotlin :app:testReleaseUnitTest --continue

  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: code-quality
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Check dependencyCheckAnalyze availability
        id: dependency-check-task
        run: |
          if ./gradlew tasks --all --no-daemon --console=plain | grep -qE '^dependencyCheckAnalyze( |$)'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "dependencyCheckAnalyze task not found; skipping OWASP scan."
          fi

      - name: Run OWASP Dependency Check
        if: steps.dependency-check-task.outputs.available == 'true'
        continue-on-error: true
        run: ./gradlew --no-daemon dependencyCheckAnalyze

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report-${{ github.run_number }}
          path: '**/build/reports/dependency-check-report.*'
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          cache: false

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  android-debug:
    name: Android Debug Build
    runs-on: ubuntu-latest
    needs: [ test, security-scan ]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: APK size gate (30MB max)
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          SIZE_KB="$(du -k "$APK_PATH" | cut -f1)"
          MAX_KB=30720
          echo "APK size: ${SIZE_KB}KB / max ${MAX_KB}KB"
          if [ "$SIZE_KB" -gt "$MAX_KB" ]; then
            echo "APK size exceeds limit"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Debug build summary
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          APK_SIZE="$(du -sh "$APK_PATH" | cut -f1)"
          {
            echo "## Android Debug Build"
            echo ""
            echo "- APK: \`$APK_PATH\`"
            echo "- Size: $APK_SIZE"
            echo "- Run: #${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: [ test, security-scan ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release == true)
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -Pandroid.injected.signing.store.file="${{ env.KEYSTORE_PATH }}" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [ code-quality, test, security-scan, android-debug, android-release ]

    steps:
      - name: Write job summary
        run: |
          {
            echo "# Android Pipeline #${{ github.run_number }}"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Code Quality | ${{ needs.code-quality.result }} |"
            echo "| Unit Tests | ${{ needs.test.result }} |"
            echo "| Security Scan | ${{ needs.security-scan.result }} |"
            echo "| Android Debug | ${{ needs.android-debug.result }} |"
            echo "| Android Release | ${{ needs.android-release.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
