name: Android CI

on:
  pull_request:
    branches: [main, 'feature/omnilink-v1.2-live-history']
  push:
    # Only the maintainer's designated test branch can auto-deliver Admin to Telegram.
    branches: [main, 'feat/auto-free-first-model-routing']
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"
  ANDROID_CMAKE_VERSION: "3.22.1"
  CI_GRADLE_JVMARGS: "-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"

jobs:
  run-quality:
    name: Run Quality
    # Only existing repository write access can supply a same-repository branch.
    # Public forks must not consume the Android build pipeline.
    if: github.repository == 'obieda-hussien/OmniDev-Workspace' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify flavor source boundaries
        run: python3 scripts/verify_flavors.py

      - name: Validate English project text and tool/skill catalog
        run: python3 scripts/check_project_language.py

      - name: Self-test dependency security policy
        run: python3 scripts/test_dependency_security.py

      - name: Self-test Gradle failure annotations
        run: python3 scripts/test_ci_failure_annotations.py

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Test OmniLink discovery and launcher capability policies
        run: python3 scripts/test_launcher_link.py

      - name: Self-test private keystore restoration
        run: bash .github/scripts/test-restore-release-keystore.sh

      - name: Self-test single-file Admin delivery packaging
        run: python3 .github/scripts/test-package-admin-delivery.py

      - name: Self-test voice native APK verification
        run: python3 .github/scripts/test-verify-voice-native-apk.py

      - name: Self-test Android CMake installation recovery
        run: python3 .github/scripts/test-install-android-cmake.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Test Gradle dependency retry policy
        run: python3 .github/scripts/test-gradle-with-retry.py

      - name: Install and verify Android CMake with retry/backoff
        run: bash .github/scripts/install-android-cmake.sh

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew .github/scripts/fetch-omnilink.sh

      - name: Stage OmniLinkSDK with retry/backoff
        run: bash .github/scripts/fetch-omnilink.sh

      - name: Share OmniLinkSDK with downstream jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2
          if-no-files-found: error
          retention-days: 1

      - name: Fast quality compile gate
        run: |
          bash .github/scripts/gradle-with-retry.sh --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            :app:verifyLiteRuntimeDependencies \
            writeBuildToolDependencyInventory \
            :app:writeRuntimeDependencyInventories \
            :app:compileLiteReleaseKotlin \
            :app:compileOemReleaseKotlin \
            :oem-system:compileReleaseKotlin \
            --stacktrace

      - name: Verify security floors in resolved build and runtime dependencies
        run: python3 scripts/verify_dependency_security.py build/reports/build-tool-dependencies.txt --runtime app/build/reports/runtime-dependencies/*.txt

      - name: Verify final Lite manifest permissions
        run: python3 scripts/verify_flavors.py --lite-manifest app/build/intermediates/merged_manifests/liteRelease/processLiteReleaseManifest/AndroidManifest.xml

      - name: Upload resolved Lite runtime dependency inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-runtime-dependencies-${{ github.run_id }}
          path: app/build/reports/lite-runtime-dependencies.txt
          if-no-files-found: ignore

      - name: Upload build and runtime dependency inventories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-dependency-inventories-${{ github.run_id }}
          path: |
            build/reports/build-tool-dependencies.txt
            app/build/reports/runtime-dependencies/
          if-no-files-found: ignore

      - name: Check optional static-analysis tasks
        continue-on-error: true
        run: |
          TASKS="$(./gradlew tasks --all --no-daemon --console=plain)"
          if echo "$TASKS" | grep -qE '^ktlintCheck( |$)'; then
            bash .github/scripts/gradle-with-retry.sh --no-daemon --max-workers 1 ktlintCheck
          else
            echo "ktlintCheck task not found; skipping."
          fi
          if echo "$TASKS" | grep -qE '^detekt( |$)'; then
            bash .github/scripts/gradle-with-retry.sh --no-daemon --max-workers 1 detekt
          else
            echo "detekt task not found; skipping."
          fi

  lint:
    name: Lint
    needs: run-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore staged OmniLinkSDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Install and verify Android CMake with retry/backoff
        run: bash .github/scripts/install-android-cmake.sh

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Lint all debug flavors
        run: |
          bash .github/scripts/gradle-with-retry.sh --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            :app:lintLiteDebug \
            :app:lintNormDebug \
            :app:lintProDebug \
            :app:lintOemDebug \
            :app:lintAdminDebug \
            --continue --stacktrace

      - name: Upload lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Tests
    needs: run-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore staged OmniLinkSDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Install and verify Android CMake with retry/backoff
        run: bash .github/scripts/install-android-cmake.sh

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Compile and run unit tests for all flavors
        run: |
          bash .github/scripts/gradle-with-retry.sh --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            :app:testLiteDebugUnitTest \
            :app:testNormDebugUnitTest \
            :app:testProDebugUnitTest \
            :app:testOemDebugUnitTest \
            :app:testAdminDebugUnitTest \
            :oem-system:testDebugUnitTest \
            --continue --stacktrace

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            oem-system/build/reports/tests/**
            oem-system/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  release-apk:
    name: Release APK
    needs: run-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore staged OmniLinkSDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Install and verify Android CMake with retry/backoff
        run: bash .github/scripts/install-android-cmake.sh

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # ADMIN is a private developer flavor: never publish its APK as a public CI artifact.
      - name: Build distributable release APKs
        run: |
          bash .github/scripts/gradle-with-retry.sh --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            :app:assembleLiteRelease \
            :app:assembleNormRelease \
            :app:assembleProRelease \
            :app:assembleOemRelease \
            :oem-system:assembleRelease \
            --continue --stacktrace

      - name: Verify JNA and Vosk survive release shrinking
        run: |
          python3 .github/scripts/verify-voice-native-apk.py \
            app/build/outputs/apk/lite/release/*.apk \
            app/build/outputs/apk/norm/release/*.apk \
            app/build/outputs/apk/pro/release/*.apk \
            app/build/outputs/apk/oem/release/*.apk

      - name: Upload release APKs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/lite/release/*.apk
            app/build/outputs/apk/norm/release/*.apk
            app/build/outputs/apk/pro/release/*.apk
            app/build/outputs/apk/oem/release/*.apk
            oem-system/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

  ui-instrumentation:
    name: UI regression tests (API 30)
    needs: run-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore staged OmniLinkSDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK and emulator
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} emulator system-images;android-30;google_apis;x86_64'
      - name: Install and verify Android CMake with retry/backoff
        run: bash .github/scripts/install-android-cmake.sh

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI regression tests
        run: bash .github/scripts/run-ui-regressions.sh
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-regression-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/omni-emulator.log
          if-no-files-found: ignore
          retention-days: 14

  admin-release-telegram:
    name: Private Admin Release (Telegram)
    # Secrets are never exposed to PRs or unlisted branch pushes.
    # A maintainer may explicitly dispatch a trusted repository branch for private testing.
    # A test failure must not silently skip a PRIVATE Admin test APK.
    # Require successful code quality, lint and distributable release build;
    # keep the unit test result for a clear unverified-build warning.
    if: ${{ always() && github.repository == 'obieda-hussien/OmniDev-Workspace' && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/auto-free-first-model-routing')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))) && needs['run-quality'].result == 'success' && needs.lint.result == 'success' && needs['release-apk'].result == 'success' }}
    needs: [run-quality, lint, tests, release-apk]
    environment: copilot
    env:
      OMNI_TESTS_RESULT: ${{ needs.tests.result }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout trusted repository ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore staged OmniLinkSDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Install and verify Android CMake with retry/backoff
        run: bash .github/scripts/install-android-cmake.sh

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Prepare Admin signing mode
        shell: bash
        env:
          OMNI_SHARED_RELEASE_KEYSTORE_BASE64: ${{ secrets.OMNI_SHARED_RELEASE_KEYSTORE_BASE64 }}
          OMNI_SHARED_RELEASE_STORE_PASSWORD: ${{ secrets.OMNI_SHARED_RELEASE_STORE_PASSWORD }}
          OMNI_SHARED_RELEASE_KEY_ALIAS: ${{ secrets.OMNI_SHARED_RELEASE_KEY_ALIAS }}
          OMNI_SHARED_RELEASE_KEY_PASSWORD: ${{ secrets.OMNI_SHARED_RELEASE_KEY_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          for required in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::Missing $required in the copilot environment secrets; Admin APK cannot be delivered privately."
              exit 1
            fi
          done

          signing_complete=true
          for optional in OMNI_SHARED_RELEASE_KEYSTORE_BASE64 OMNI_SHARED_RELEASE_STORE_PASSWORD OMNI_SHARED_RELEASE_KEY_ALIAS OMNI_SHARED_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!optional:-}" ]]; then
              signing_complete=false
            fi
          done

          mode="unsigned"
          if [[ "$signing_complete" == "true" ]]; then
            if restore_output="$(bash .github/scripts/restore-release-keystore.sh "$RUNNER_TEMP/omni-admin-release.keystore" 2>&1)"; then
              mode="signed"
              echo "Release signing credentials validated; CI will deliver a signed Admin APK."
            else
              while IFS= read -r line; do
                echo "${line/::error::/::warning::}"
              done <<< "$restore_output"
              echo "::warning::Release signing credentials are unusable; falling back to an unsigned Admin APK for local signing."
            fi
          else
            echo "::warning::Release signing credentials are incomplete; building an unsigned Admin APK for local signing."
          fi

          echo "ADMIN_SIGNING_MODE=$mode" >> "$GITHUB_ENV"

      - name: Build Admin release
        shell: bash
        env:
          OMNI_SHARED_RELEASE_STORE_PASSWORD: ${{ secrets.OMNI_SHARED_RELEASE_STORE_PASSWORD }}
          OMNI_SHARED_RELEASE_KEY_ALIAS: ${{ secrets.OMNI_SHARED_RELEASE_KEY_ALIAS }}
          OMNI_SHARED_RELEASE_KEY_PASSWORD: ${{ secrets.OMNI_SHARED_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          unsigned_arg=()
          if [[ "$ADMIN_SIGNING_MODE" == "unsigned" ]]; then
            unsigned_arg+=("-POMNI_ADMIN_UNSIGNED_RELEASE=true")
          fi

          bash .github/scripts/gradle-with-retry.sh --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            "${unsigned_arg[@]}" \
            :app:assembleAdminRelease --stacktrace

      - name: Verify Admin voice native APK
        run: python3 .github/scripts/verify-voice-native-apk.py app/build/outputs/apk/admin/release/*.apk

      - name: Verify Admin APK output
        shell: bash
        env:
          OMNI_SHARED_RELEASE_CERT_SHA256: ${{ secrets.OMNI_SHARED_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find app/build/outputs/apk/admin/release -maxdepth 1 -type f -name '*.apk' -print0)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Admin release APK; found ${#apks[@]}."
            exit 1
          fi

          apk="${apks[0]}"
          apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"

          if [[ "$ADMIN_SIGNING_MODE" == "signed" ]]; then
            if [[ "$apk" == *unsigned* ]]; then
              echo "::error::CI expected a signed Admin APK but Gradle produced an unsigned file."
              exit 1
            fi
            "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/admin-signature.txt" || {
              echo "::error::Admin APK signature verification failed."
              exit 1
            }
            if [[ -n "$OMNI_SHARED_RELEASE_CERT_SHA256" ]]; then
              actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/admin-signature.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
              expected="$(printf '%s' "$OMNI_SHARED_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
              if [[ -z "$actual" || "$actual" != "$expected" ]]; then
                echo "::error::Admin APK signer differs from the expected shared Omni release certificate."
                exit 1
              fi
            fi
            delivery_name="OmniDev-admin-release.apk"
            delivery_note="SIGNED"
          else
            if "$apksigner" verify "$apk" >/dev/null 2>&1; then
              echo "::error::CI requested an unsigned Admin APK but the output is already signed."
              exit 1
            fi
            delivery_name="OmniDev-admin-release-unsigned.apk"
            delivery_note="UNSIGNED - sign locally before installation"
            echo "::warning::Admin APK is intentionally unsigned. Sign it locally with the shared Omni release keystore before installing or updating."
          fi

          echo "ADMIN_APK=$apk" >> "$GITHUB_ENV"
          echo "ADMIN_APK_FILENAME=$delivery_name" >> "$GITHUB_ENV"
          echo "ADMIN_DELIVERY_NOTE=$delivery_note" >> "$GITHUB_ENV"
          echo "ADMIN_APK_SHA256=$(sha256sum "$apk" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Prepare single-file Admin Telegram delivery
        run: python3 .github/scripts/package-admin-delivery.py

      - name: Send Admin APK or ZIP to configured Telegram chat
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/telegram-send-document.json"
          sha_short="${GITHUB_SHA:0:12}"
          local_size="$(stat -c '%s' "$ADMIN_DELIVERY_FILE")"

          if [[ "${OMNI_TESTS_RESULT}" != "success" ]]; then
            echo "::warning::The Admin APK is a TEST-ONLY build: unit tests finished with ${OMNI_TESTS_RESULT}."
          fi
          echo "Uploading Admin document: $ADMIN_DELIVERY_FILENAME"
          echo "Local size: $local_size bytes"
          echo "APK SHA-256: $ADMIN_APK_SHA256"
          echo "Document SHA-256: $ADMIN_DELIVERY_SHA256"

          if ! curl --silent --show-error --fail --connect-timeout 20 --max-time 300 \
            --output "$response" \
            --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form "document=@${ADMIN_DELIVERY_FILE};filename=${ADMIN_DELIVERY_FILENAME};type=${ADMIN_DELIVERY_MIME}" \
            --form-string "caption=OmniDev Admin • branch ${GITHUB_REF_NAME} • tests: ${OMNI_TESTS_RESULT} • $ADMIN_DELIVERY_NOTE • $ADMIN_DELIVERY_FORMAT • run #${GITHUB_RUN_NUMBER} • ${sha_short} • APK SHA-256: ${ADMIN_APK_SHA256} • Document SHA-256: ${ADMIN_DELIVERY_SHA256}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"; then
            echo "::error::Telegram document upload failed; Admin APK was not published as a GitHub artifact."
            exit 1
          fi

          if ! jq -e '.ok == true' "$response" >/dev/null; then
            echo "::error::Telegram API rejected the Admin document; verify bot permissions, private chat ID and file-size limits."
            jq -c '{ok, error_code, description}' "$response" >&2 || true
            exit 1
          fi

          remote_size="$(jq -r '.result.document.file_size // 0' "$response")"
          if [[ "$remote_size" != "$local_size" ]]; then
            echo "::error::Telegram uploaded file size mismatch: local=$local_size remote=$remote_size"
            exit 1
          fi

          echo "Admin APK delivered privately via Telegram in $ADMIN_SIGNING_MODE mode; verified $remote_size bytes; no Admin APK artifact was uploaded."


  pipeline-summary:
    name: Pipeline Summary
    if: always()
    needs: [run-quality, lint, tests, release-apk, ui-instrumentation, admin-release-telegram]
    runs-on: ubuntu-24.04

    steps:
      - name: Write summary
        run: |
          {
            echo "# Android CI #${{ github.run_number }}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Run Quality | ${{ needs.run-quality.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Tests | ${{ needs.tests.result }} |"
            echo "| UI regression tests | ${{ needs.ui-instrumentation.result }} |"
            echo "| Release APK | ${{ needs.release-apk.result }} |"
            echo "| Private Admin Telegram | ${{ needs.admin-release-telegram.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
