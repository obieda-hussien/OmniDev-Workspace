name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build release APKs"
        required: false
        default: true
        type: boolean
      enable_extended_checks:
        description: "Enable release compile/unit checks"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.incremental=false"
  MAX_DEBUG_APK_SIZE_KB: "153600"

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Cache native build directories
        uses: actions/cache@v5
        with:
          path: |
            app/.cxx
            ~/.cmake
          key: native-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Print toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;35.0.0|platform-tools' || true

      - name: Run lint checks for all flavors
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:lintLiteDebug \
            :app:lintNormDebug \
            :app:lintProDebug \
            :app:lintOemDebug \
            :app:lintAdminDebug \
            --continue

      - name: Optional static analysis
        continue-on-error: true
        run: |
          TASKS="$(./gradlew tasks --all --no-daemon --console=plain)"
          if echo "$TASKS" | grep -qE '^ktlintCheck( |$)'; then
            ./gradlew --no-daemon ktlintCheck
          else
            echo "ktlintCheck task not found; skipping."
          fi
          if echo "$TASKS" | grep -qE '^detekt( |$)'; then
            ./gradlew --no-daemon detekt
          else
            echo "detekt task not found; skipping."
          fi

      - name: Upload quality reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Send quality reports to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping upload."
            exit 0
          fi
          zip -r quality-reports.zip app/build/reports/lint-results*.html app/build/reports/lint-results*.xml app/build/reports/ktlint/ app/build/reports/detekt/ 2>/dev/null || true
          if [ -f quality-reports.zip ]; then
            curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" -F document=@quality-reports.zip || true
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: code-quality
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Compile and run unit tests for all flavors
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:compileLiteDebugKotlin :app:testLiteDebugUnitTest \
            :app:compileNormDebugKotlin :app:testNormDebugUnitTest \
            :app:compileProDebugKotlin :app:testProDebugUnitTest \
            :app:compileOemDebugKotlin :app:testOemDebugUnitTest \
            :app:compileAdminDebugKotlin :app:testAdminDebugUnitTest \
            --continue

      - name: Optional extended checks
        if: github.event_name == 'workflow_dispatch' && inputs.enable_extended_checks == true
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:compileLiteReleaseKotlin :app:testLiteReleaseUnitTest \
            :app:compileProReleaseKotlin :app:testProReleaseUnitTest \
            --continue

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Send test reports to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping upload."
            exit 0
          fi
          zip -r test-reports.zip app/build/reports/tests/ app/build/test-results/ 2>/dev/null || true
          if [ -f test-reports.zip ]; then
            curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" -F document=@test-reports.zip || true
          fi

  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: code-quality
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Check dependencyCheckAnalyze availability
        id: dependency-check-task
        run: |
          if ./gradlew tasks --all --no-daemon --console=plain | grep -qE '(^|:)dependencyCheckAnalyze( |$)'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OWASP Dependency Check
        if: steps.dependency-check-task.outputs.available == 'true'
        continue-on-error: true
        run: ./gradlew --no-daemon :app:dependencyCheckAnalyze

      - name: Upload OWASP report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report-${{ github.run_number }}
          path: '**/build/reports/dependency-check-report.*'
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: trivy-results-${{ github.run_number }}
          path: trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 14

  android-debug:
    name: Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [ test, security-scan ]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build all debug flavor APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:assembleLiteDebug \
            :app:assembleNormDebug \
            :app:assembleProDebug \
            :app:assembleOemDebug \
            :app:assembleAdminDebug

      - name: APK size gate per flavor
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk -name '*.apk' | grep '/debug/' || true)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No debug APKs found."
            exit 1
          fi
          for APK_PATH in "${APKS[@]}"; do
            SIZE_KB="$(du -k "$APK_PATH" | cut -f1)"
            echo "- $APK_PATH: ${SIZE_KB}KB"
            if [ "$SIZE_KB" -gt "$MAX_DEBUG_APK_SIZE_KB" ]; then
              echo "::error::APK size ${SIZE_KB}KB exceeds ${MAX_DEBUG_APK_SIZE_KB}KB: $APK_PATH"
              exit 1
            fi
          done

      - name: Upload debug APKs
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-flavors-${{ github.run_number }}
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Send debug APKs to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping upload."
            exit 0
          fi
          for FILE in app/build/outputs/apk/*/debug/*.apk; do
            [ -f "$FILE" ] || continue
            SIZE=$(stat -c%s "$FILE")
            if [ "$SIZE" -gt 48000000 ]; then
              split -b 45m "$FILE" "$FILE.part_"
              for PART in "$FILE".part_*; do
                curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                  -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"$PART" || true
              done
              rm -f "$FILE".part_*
            else
              curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"$FILE" || true
            fi
          done

  android-release:
    name: Android Release Build
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_release == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [ test, security-scan ]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Prepare signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          READY=false
          REASON="Signing secrets are missing."
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            if echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore" 2>/dev/null && [ -s "$RUNNER_TEMP/release.keystore" ]; then
              if keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                READY=true
                echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
              else
                REASON="Keystore/password/alias validation failed."
              fi
            else
              REASON="KEYSTORE_BASE64 is invalid or empty."
            fi
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" != true ]; then
            echo "::warning::$REASON"
            rm -f "$RUNNER_TEMP/release.keystore"
          fi

      - name: Build signed release APKs
        if: steps.signing.outputs.ready == 'true'
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:assembleLiteRelease :app:assembleNormRelease :app:assembleProRelease :app:assembleOemRelease :app:assembleAdminRelease \
            -Pandroid.injected.signing.store.file="${{ env.KEYSTORE_PATH }}" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build unsigned release APKs
        if: steps.signing.outputs.ready != 'true'
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            :app:assembleLiteRelease \
            :app:assembleNormRelease \
            :app:assembleProRelease \
            :app:assembleOemRelease \
            :app:assembleAdminRelease

      - name: Upload release APKs
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: app-release-flavors-${{ github.run_number }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Send release APKs to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping upload."
            exit 0
          fi
          for FILE in app/build/outputs/apk/*/release/*.apk; do
            [ -f "$FILE" ] || continue
            SIZE=$(stat -c%s "$FILE")
            if [ "$SIZE" -gt 48000000 ]; then
              split -b 45m "$FILE" "$FILE.part_"
              for PART in "$FILE".part_*; do
                curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                  -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"$PART" || true
              done
              rm -f "$FILE".part_*
            else
              curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"$FILE" || true
            fi
          done

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/*/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [ code-quality, test, security-scan, android-debug, android-release ]

    steps:
      - name: Write job summary
        run: |
          {
            echo "# Android Pipeline #${{ github.run_number }}"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Code Quality | ${{ needs.code-quality.result }} |"
            echo "| Unit Tests | ${{ needs.test.result }} |"
            echo "| Security Scan | ${{ needs.security-scan.result }} |"
            echo "| Android Debug | ${{ needs.android-debug.result }} |"
            echo "| Android Release | ${{ needs.android-release.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
