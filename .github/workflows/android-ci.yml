name: Android CI

on:
  pull_request:
    branches: [main, 'feature/omnilink-v1.2-live-history']
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"
  CI_GRADLE_JVMARGS: "-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError"

jobs:
  run-quality:
    name: Run Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} cmake;3.22.1'

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew .github/scripts/fetch-omnilink.sh

      - name: Stage OmniLinkSDK with retry/backoff
        run: bash .github/scripts/fetch-omnilink.sh

      - name: Share OmniLinkSDK with downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2
          if-no-files-found: error
          retention-days: 1

      - name: Fast quality compile gate
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            :app:compileLiteReleaseKotlin \
            --stacktrace

      - name: Check optional static-analysis tasks
        continue-on-error: true
        run: |
          TASKS="$(./gradlew tasks --all --no-daemon --console=plain)"
          if echo "$TASKS" | grep -qE '^ktlintCheck( |$)'; then
            ./gradlew --no-daemon --max-workers 1 ktlintCheck
          else
            echo "ktlintCheck task not found; skipping."
          fi
          if echo "$TASKS" | grep -qE '^detekt( |$)'; then
            ./gradlew --no-daemon --max-workers 1 detekt
          else
            echo "detekt task not found; skipping."
          fi

  lint:
    name: Lint
    needs: run-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore staged OmniLinkSDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} cmake;3.22.1'

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Lint all debug flavors
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            :app:lintLiteDebug \
            :app:lintNormDebug \
            :app:lintProDebug \
            :app:lintOemDebug \
            :app:lintAdminDebug \
            --continue --stacktrace

      - name: Upload lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Tests
    needs: run-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore staged OmniLinkSDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} cmake;3.22.1'

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Compile and run unit tests for all flavors
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            :app:testLiteDebugUnitTest \
            :app:testNormDebugUnitTest \
            :app:testProDebugUnitTest \
            :app:testOemDebugUnitTest \
            :app:testAdminDebugUnitTest \
            --continue --stacktrace

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  release-apk:
    name: Release APK
    needs: run-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore staged OmniLinkSDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} cmake;3.22.1'

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # ADMIN is a private developer flavor: never publish its APK as a public CI artifact.
      - name: Build distributable release APKs
        run: |
          ./gradlew --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            :app:assembleLiteRelease \
            :app:assembleNormRelease \
            :app:assembleProRelease \
            :app:assembleOemRelease \
            --continue --stacktrace

      - name: Upload release APKs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/lite/release/*.apk
            app/build/outputs/apk/norm/release/*.apk
            app/build/outputs/apk/pro/release/*.apk
            app/build/outputs/apk/oem/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

  admin-release-telegram:
    name: Private Admin Release (Telegram)
    # Never use environment secrets on PR or on a non-main manual dispatch.
    if: github.repository == 'obieda-hussien/OmniDev-Workspace' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [run-quality, lint, tests, release-apk]
    environment: copilot
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Restore staged OmniLinkSDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omnilink-maven-${{ github.run_id }}
          path: ci-m2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} cmake;3.22.1'

      - name: Install and verify Android NDK
        run: bash .github/scripts/install-android-ndk.sh

      - name: Restore private release keystore
        shell: bash
        env:
          OMNI_SHARED_RELEASE_KEYSTORE_BASE64: ${{ secrets.OMNI_SHARED_RELEASE_KEYSTORE_BASE64 }}
          OMNI_SHARED_RELEASE_STORE_PASSWORD: ${{ secrets.OMNI_SHARED_RELEASE_STORE_PASSWORD }}
          OMNI_SHARED_RELEASE_KEY_ALIAS: ${{ secrets.OMNI_SHARED_RELEASE_KEY_ALIAS }}
          OMNI_SHARED_RELEASE_KEY_PASSWORD: ${{ secrets.OMNI_SHARED_RELEASE_KEY_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          for required in OMNI_SHARED_RELEASE_KEYSTORE_BASE64 OMNI_SHARED_RELEASE_STORE_PASSWORD OMNI_SHARED_RELEASE_KEY_ALIAS OMNI_SHARED_RELEASE_KEY_PASSWORD TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Missing $required in the copilot environment secrets; Admin APK will not be built or delivered."
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/omni-admin-release.jks"
          printf '%s' "$OMNI_SHARED_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore" || { echo "::error::Decoded release keystore is empty."; exit 1; }
          echo "OMNI_SHARED_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed Admin release only
        shell: bash
        env:
          OMNI_SHARED_RELEASE_STORE_PASSWORD: ${{ secrets.OMNI_SHARED_RELEASE_STORE_PASSWORD }}
          OMNI_SHARED_RELEASE_KEY_ALIAS: ${{ secrets.OMNI_SHARED_RELEASE_KEY_ALIAS }}
          OMNI_SHARED_RELEASE_KEY_PASSWORD: ${{ secrets.OMNI_SHARED_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers 1 \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.incremental=false \
            -Dorg.gradle.vfs.watch=false \
            :app:assembleAdminRelease --stacktrace

      - name: Verify exact Admin APK and signer
        shell: bash
        env:
          OMNI_SHARED_RELEASE_CERT_SHA256: ${{ secrets.OMNI_SHARED_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find app/build/outputs/apk/admin/release -maxdepth 1 -type f -name '*.apk' -print0)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Admin release APK; found ${#apks[@]}."
            exit 1
          fi
          apk="${apks[0]}"
          if [[ "$apk" == *unsigned* ]]; then
            echo "::error::Refusing to deliver an unsigned Admin APK."
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/admin-signature.txt" || {
            echo "::error::Admin APK signature verification failed."
            exit 1
          }
          if [[ -n "$OMNI_SHARED_RELEASE_CERT_SHA256" ]]; then
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/admin-signature.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            expected="$(printf '%s' "$OMNI_SHARED_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [[ -z "$actual" || "$actual" != "$expected" ]]; then
              echo "::error::Admin APK signer differs from the expected shared Omni release certificate."
              exit 1
            fi
          fi
          bytes="$(stat -c '%s' "$apk")"
          if (( bytes > 50000000 )); then
            echo "::error::Admin APK exceeds Telegram cloud Bot API's 50 MB upload limit; refusing partial delivery."
            exit 1
          fi
          echo "ADMIN_APK=$apk" >> "$GITHUB_ENV"
          echo "ADMIN_APK_SHA256=$(sha256sum "$apk" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Send Admin APK to configured Telegram chat
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/telegram-send-document.json"
          sha_short="${GITHUB_SHA:0:12}"
          if ! curl --silent --show-error --fail --connect-timeout 20 --max-time 180 \
            --output "$response" \
            --form "chat_id=$TELEGRAM_CHAT_ID" \
            --form "document=@${ADMIN_APK};filename=OmniDev-admin-release.apk;type=application/vnd.android.package-archive" \
            --form "caption=OmniDev Admin • run #${GITHUB_RUN_NUMBER} • ${sha_short} • SHA-256: ${ADMIN_APK_SHA256}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"; then
            echo "::error::Telegram document upload failed; Admin APK was not published as a GitHub artifact."
            exit 1
          fi
          if ! jq -e '.ok == true' "$response" >/dev/null; then
            echo "::error::Telegram API rejected the Admin APK; verify bot permissions, private chat ID and file-size limits."
            exit 1
          fi
          echo "Signed Admin APK delivered to the configured Telegram chat; no Admin APK artifact was uploaded."

  pipeline-summary:
    name: Pipeline Summary
    if: always()
    needs: [run-quality, lint, tests, release-apk, admin-release-telegram]
    runs-on: ubuntu-24.04

    steps:
      - name: Write summary
        run: |
          {
            echo "# Android CI #${{ github.run_number }}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Run Quality | ${{ needs.run-quality.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Tests | ${{ needs.tests.result }} |"
            echo "| Release APK | ${{ needs.release-apk.result }} |"
            echo "| Private Admin Telegram | ${{ needs.admin-release-telegram.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
