name: OmniDev 4-Tier CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed release APKs"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  # Max size allowed for Pro/OEM (with Llama.cpp) vs Lite/Norm (No NDK)
  MAX_NATIVE_APK_SIZE_KB: 85000 
  MAX_LITE_APK_SIZE_KB: 25000

jobs:
  code-quality:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Grant gradlew permission
        run: chmod +x gradlew
      - name: Run Lint on all flavors
        # Runs lint for all 4 flavors
        run: ./gradlew --no-daemon :app:lintLiteDebug :app:lintNormDebug :app:lintProDebug :app:lintOemDebug
      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-reports-${{ github.run_number }}
          path: app/build/reports/lint-results*.html
          retention-days: 7

  unit-tests:
    name: Unit Tests (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        flavor: [Lite, Norm, Pro, Oem]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Grant gradlew permission
        run: chmod +x gradlew
      - name: Run Unit Tests
        run: ./gradlew --no-daemon :app:test${{ matrix.flavor }}DebugUnitTest --continue
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.flavor }}-${{ github.run_number }}
          path: app/build/reports/tests/

  build-debug:
    name: Build Debug APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        flavor: [Lite, Norm, Pro, Oem]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive # Crucial for llama.cpp on Pro/OEM
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
      - name: Grant gradlew permission
        run: chmod +x gradlew
      
      - name: Assemble Debug APK
        run: ./gradlew --no-daemon :app:assemble${{ matrix.flavor }}Debug

      - name: APK Size Gate
        run: |
          APK_PATH="$(find app/build/outputs/apk/${{ matrix.flavor }}/debug -name '*.apk' | head -1)"
          SIZE_KB="$(du -k "$APK_PATH" | cut -f1)"
          
          if [[ "${{ matrix.flavor }}" == "Lite" ]] || [[ "${{ matrix.flavor }}" == "Norm" ]]; then
            MAX_KB="${{ env.MAX_LITE_APK_SIZE_KB }}"
          else
            MAX_KB="${{ env.MAX_NATIVE_APK_SIZE_KB }}"
          fi
          
          echo "Flavor: ${{ matrix.flavor }} | Size: ${SIZE_KB}KB / max ${MAX_KB}KB"
          if [ "$SIZE_KB" -gt "$MAX_KB" ]; then
            echo "::error::APK size ${SIZE_KB}KB exceeds maximum ${MAX_KB}KB for ${{ matrix.flavor }}"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: OmniDev-${{ matrix.flavor }}-Debug-${{ github.run_number }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/**/*.apk
          retention-days: 14

  build-release:
    name: Build Release APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: build-debug
    if: github.event_name == 'workflow_dispatch' && inputs.build_release == true || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        flavor: [Lite, Norm, Pro, Oem]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Grant gradlew permission
        run: chmod +x gradlew
      
      - name: Decode Keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > release.keystore
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assemble${{ matrix.flavor }}Release \
            -Pandroid.injected.signing.store.file="$(pwd)/release.keystore" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Upload Release Artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: OmniDev-${{ matrix.flavor }}-Release-${{ github.run_number }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
