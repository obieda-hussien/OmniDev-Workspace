name: Public repository security gate

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    branches:
      - main
      - 'feature/omnilink-v1.2-live-history'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-repo-guard:
    name: Secret history and workflow hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisting the token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Scan current tree, workflows, and full Git history
        run: python3 scripts/public_repo_guard.py --history
