name: Agent runtime repair verification
on:
  push:
    branches: [codex/repair-agent-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run regression tests
        run: bash ./gradlew :app:compileNormDebugKotlin :app:testNormDebugUnitTest :app:compileAdminDebugKotlin :app:compileNormDebugAndroidTestKotlin --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: repair-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
