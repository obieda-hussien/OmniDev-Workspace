version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ci-patches:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Core 1.19 needs API 37 and AGP 9; the current runtime baseline is API 36.
    # Toolchain major upgrades need an explicit migration and separate validation.
    ignore:
      # OkHttp 5.5+ requires API 37; revisit with the Android toolchain migration.
      - dependency-name: "com.squareup.okhttp3:*"
        versions: [">=5.5"]
      - dependency-name: "androidx.core:*"
        versions: [">=1.18"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
    groups:
      kotlin-plugins:
        patterns: ["org.jetbrains.kotlin.*"]
        update-types: ["minor", "patch"]
