version: 2.1

executors:
  android-machine:
    machine:
      image: android:current
    resource_class: medium.gen2

commands:
  send-files-to-telegram:
    parameters:
      paths:
        type: string
      label:
        type: string
        default: "CircleCI artifact"
    steps:
      - run:
          name: Send complete files to Telegram
          when: always
          command: |
            set +e
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "TELEGRAM_BOT_TOKEN is not configured in CircleCI Project Settings; skipping Telegram upload."
              exit 0
            fi

            CHAT_ID="1100444932"
            LABEL='<< parameters.label >>'
            FOUND=0
            shopt -s globstar nullglob

            send_file() {
              FILE="$1"
              [ -f "$FILE" ] || return 0
              FOUND=1
              SIZE=$(wc -c < "$FILE" | tr -d ' ')
              NAME=$(basename "$FILE")

              # Files are always sent intact. Never split/chunk artifacts.
              if [ "$SIZE" -gt 50000000 ]; then
                echo "Skipping $FILE: ${SIZE} bytes exceeds Telegram Bot API direct-upload limit. File was NOT split."
                curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="$CHAT_ID" \
                  --data-urlencode "text=⚠️ ${LABEL}: ${NAME} is ${SIZE} bytes and exceeds Telegram's direct-upload limit. It was not split." \
                  >/dev/null || true
                return 0
              fi

              echo "Sending complete file: $FILE (${SIZE} bytes)"
              curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="$CHAT_ID" \
                -F document=@"$FILE" \
                -F "caption=${LABEL} | ${CIRCLE_PROJECT_REPONAME:-OmniDev-Workspace} | ${CIRCLE_BRANCH:-unknown} | build ${CIRCLE_BUILD_NUM:-unknown}" \
                >/dev/null || true
            }

            printf '%s\n' '<< parameters.paths >>' > /tmp/telegram-patterns.txt
            while IFS= read -r PATTERN; do
              [ -n "$PATTERN" ] || continue
              while IFS= read -r FILE; do
                [ -n "$FILE" ] && send_file "$FILE"
              done < <(compgen -G "$PATTERN" || true)
            done < /tmp/telegram-patterns.txt

            if [ "$FOUND" -eq 0 ]; then
              echo "No matching files found for Telegram upload."
            fi

jobs:
  android-ci:
    executor: android-machine
    steps:
      - checkout

      - run:
          name: Prepare Android toolchain
          command: |
            set -euo pipefail
            chmod +x gradlew
            java -version
            ./gradlew --version
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;35.0.0" \
              "ndk;27.0.12077973" \
              "cmake;3.22.1"
            git submodule update --init --recursive --depth 1 || true
            mkdir -p ci-logs /tmp/omnidev-ci-status

      - restore_cache:
          keys:
            - gradle-v3-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}
            - gradle-v3-

      - run:
          name: Lint all debug flavors
          command: |
            set +e
            set -o pipefail
            ./gradlew --no-daemon --max-workers 1 \
              :app:lintLiteDebug \
              :app:lintNormDebug \
              :app:lintProDebug \
              :app:lintOemDebug \
              :app:lintAdminDebug \
              --continue 2>&1 | tee ci-logs/lint.log
            RC=${PIPESTATUS[0]}
            echo "$RC" > /tmp/omnidev-ci-status/lint
            echo "LINT_EXIT_CODE=$RC"
            exit 0

      - send-files-to-telegram:
          label: "Lint diagnostic log"
          paths: |
            ci-logs/lint.log
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml

      - run:
          name: Compile and run unit tests
          command: |
            set +e
            set -o pipefail
            ./gradlew --no-daemon --max-workers 1 \
              :app:compileLiteDebugKotlin :app:testLiteDebugUnitTest \
              :app:compileNormDebugKotlin :app:testNormDebugUnitTest \
              :app:compileProDebugKotlin :app:testProDebugUnitTest \
              :app:compileOemDebugKotlin :app:testOemDebugUnitTest \
              :app:compileAdminDebugKotlin :app:testAdminDebugUnitTest \
              --continue 2>&1 | tee ci-logs/tests.log
            RC=${PIPESTATUS[0]}
            echo "$RC" > /tmp/omnidev-ci-status/tests
            echo "TESTS_EXIT_CODE=$RC"
            exit 0

      - store_test_results:
          path: app/build/test-results

      - send-files-to-telegram:
          label: "Unit test diagnostic log"
          paths: |
            ci-logs/tests.log
            app/build/test-results/**/*.xml

      - run:
          name: Build all debug APKs
          command: |
            set +e
            set -o pipefail
            ./gradlew --no-daemon --max-workers 1 \
              :app:assembleLiteDebug \
              :app:assembleNormDebug \
              :app:assembleProDebug \
              :app:assembleOemDebug \
              :app:assembleAdminDebug \
              --continue 2>&1 | tee ci-logs/debug-build.log
            RC=${PIPESTATUS[0]}
            echo "$RC" > /tmp/omnidev-ci-status/debug
            echo "DEBUG_EXIT_CODE=$RC"
            exit 0

      - send-files-to-telegram:
          label: "Debug build output"
          paths: |
            ci-logs/debug-build.log
            app/build/outputs/apk/*/debug/*.apk

      - run:
          name: Build all release APKs
          command: |
            set +e
            set -o pipefail
            ./gradlew --no-daemon --max-workers 1 \
              :app:assembleLiteRelease \
              :app:assembleNormRelease \
              :app:assembleProRelease \
              :app:assembleOemRelease \
              :app:assembleAdminRelease \
              --continue 2>&1 | tee ci-logs/release-build.log
            RC=${PIPESTATUS[0]}
            echo "$RC" > /tmp/omnidev-ci-status/release
            echo "RELEASE_EXIT_CODE=$RC"
            exit 0

      - send-files-to-telegram:
          label: "Release build output"
          paths: |
            ci-logs/release-build.log
            app/build/outputs/apk/*/release/*.apk

      - store_artifacts:
          path: app/build/outputs/apk
          destination: apk-output

      - store_artifacts:
          path: ci-logs
          destination: ci-logs

      - save_cache:
          key: gradle-v3-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Final CI status
          when: always
          command: |
            set +e
            FAILED=0
            SUMMARY=""

            for STAGE in lint tests debug release; do
              FILE="/tmp/omnidev-ci-status/$STAGE"
              RC=99
              [ -f "$FILE" ] && RC=$(cat "$FILE")
              SUMMARY="${SUMMARY}${STAGE}=${RC} "
              if [ "$RC" -ne 0 ]; then
                FAILED=1
              fi
            done

            echo "============================================================"
            echo "OMNIDEV CI STATUS: ${SUMMARY}"
            echo "============================================================"

            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
              curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="1100444932" \
                --data-urlencode "text=OmniDev CircleCI summary | ${CIRCLE_BRANCH:-unknown} | ${SUMMARY}" \
                >/dev/null || true
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "One or more CI stages failed. Open the ci-logs artifact or Telegram diagnostic log for the exact Gradle error."
              exit 1
            fi

            echo "All OmniDev CI stages passed."

workflows:
  omnidev-ci:
    jobs:
      - android-ci
