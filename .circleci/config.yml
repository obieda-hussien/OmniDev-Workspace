version: 2.1

executors:
  android-machine:
    machine:
      image: android:current
    resource_class: large.gen2

commands:
  send-zip-to-telegram:
    parameters:
      paths:
        type: string
      label:
        type: string
        default: "CircleCI archive"
      archive_name:
        type: string
        default: "artifact"
    steps:
      - run:
          name: Send ZIP archive to Telegram
          when: always
          command: |
            set +e
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "TELEGRAM_BOT_TOKEN is not configured in CircleCI Project Settings; skipping Telegram upload."
              exit 0
            fi

            CHAT_ID="1100444932"
            LABEL='<< parameters.label >>'
            ARCHIVE_NAME='<< parameters.archive_name >>'
            shopt -s globstar nullglob
            FILES=()

            printf '%s\n' '<< parameters.paths >>' > /tmp/telegram-zip-patterns.txt
            while IFS= read -r PATTERN; do
              [ -n "$PATTERN" ] || continue
              while IFS= read -r FILE; do
                [ -n "$FILE" ] && [ -f "$FILE" ] && FILES+=("$FILE")
              done < <(compgen -G "$PATTERN" || true)
            done < /tmp/telegram-zip-patterns.txt

            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "No matching files found for ZIP upload."
              exit 0
            fi

            SAFE_BRANCH=$(printf '%s' "${CIRCLE_BRANCH:-unknown}" | tr '/ ' '--')
            ZIP_PATH="/tmp/${ARCHIVE_NAME}-${SAFE_BRANCH}-${CIRCLE_BUILD_NUM:-0}.zip"
            rm -f "$ZIP_PATH"
            zip -q "$ZIP_PATH" "${FILES[@]}"

            SIZE=$(wc -c < "$ZIP_PATH" | tr -d ' ')
            if [ "$SIZE" -gt 50000000 ]; then
              echo "ZIP ${ZIP_PATH} is ${SIZE} bytes and exceeds Telegram direct-upload limit. It will NOT be split."
              curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="$CHAT_ID" \
                --data-urlencode "text=⚠️ ${LABEL}: $(basename "$ZIP_PATH") is ${SIZE} bytes and exceeds Telegram's direct-upload limit. It was not split." \
                >/dev/null || true
              exit 0
            fi

            echo "Sending ZIP: $ZIP_PATH (${SIZE} bytes, ${#FILES[@]} files)"
            curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"$ZIP_PATH" \
              -F "caption=${LABEL} | ${CIRCLE_PROJECT_REPONAME:-OmniDev-Workspace} | ${CIRCLE_BRANCH:-unknown} | build ${CIRCLE_BUILD_NUM:-unknown}" \
              >/dev/null || true

  send-debug-apks-as-zips:
    steps:
      - run:
          name: Send each debug APK as its own ZIP
          when: always
          command: |
            set +e
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "TELEGRAM_BOT_TOKEN is not configured; skipping Telegram upload."
              exit 0
            fi

            CHAT_ID="1100444932"
            shopt -s nullglob
            APKS=(app/build/outputs/apk/*/debug/*.apk)

            if [ "${#APKS[@]}" -eq 0 ]; then
              echo "No debug APKs found."
              exit 0
            fi

            SAFE_BRANCH=$(printf '%s' "${CIRCLE_BRANCH:-unknown}" | tr '/ ' '--')

            for APK in "${APKS[@]}"; do
              NAME=$(basename "$APK" .apk)
              ZIP_PATH="/tmp/${NAME}-${SAFE_BRANCH}-${CIRCLE_BUILD_NUM:-0}.zip"
              rm -f "$ZIP_PATH"
              zip -q -j "$ZIP_PATH" "$APK"
              SIZE=$(wc -c < "$ZIP_PATH" | tr -d ' ')

              if [ "$SIZE" -gt 50000000 ]; then
                echo "Skipping $ZIP_PATH: ${SIZE} bytes exceeds Telegram direct-upload limit. ZIP was NOT split."
                curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="$CHAT_ID" \
                  --data-urlencode "text=⚠️ Debug APK ZIP ${NAME}.zip is ${SIZE} bytes and exceeds Telegram's direct-upload limit. It was not split." \
                  >/dev/null || true
                continue
              fi

              echo "Sending debug APK ZIP: $ZIP_PATH"
              curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="$CHAT_ID" \
                -F document=@"$ZIP_PATH" \
                -F "caption=Debug APK ZIP | ${NAME} | ${CIRCLE_BRANCH:-unknown} | build ${CIRCLE_BUILD_NUM:-unknown}" \
                >/dev/null || true
            done

  send-admin-release-apk:
    steps:
      - run:
          name: Send Admin release APK directly to Telegram
          when: always
          command: |
            set +e
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "TELEGRAM_BOT_TOKEN is not configured; skipping Telegram upload."
              exit 0
            fi

            CHAT_ID="1100444932"
            shopt -s nullglob
            APKS=(app/build/outputs/apk/admin/release/*.apk)

            if [ "${#APKS[@]}" -eq 0 ]; then
              echo "No Admin release APK found."
              exit 0
            fi

            for APK in "${APKS[@]}"; do
              SIZE=$(wc -c < "$APK" | tr -d ' ')
              NAME=$(basename "$APK")

              if [ "$SIZE" -gt 50000000 ]; then
                echo "Admin release APK ${NAME} exceeds Telegram direct-upload limit and will NOT be split."
                curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="$CHAT_ID" \
                  --data-urlencode "text=⚠️ Admin Release APK ${NAME} is ${SIZE} bytes and exceeds Telegram's direct-upload limit. It was not split." \
                  >/dev/null || true
                continue
              fi

              echo "Sending Admin release APK directly: $APK"
              curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="$CHAT_ID" \
                -F document=@"$APK" \
                -F "caption=🚀 OmniDev Admin Release APK | ${CIRCLE_BRANCH:-unknown} | build ${CIRCLE_BUILD_NUM:-unknown} | ${CIRCLE_SHA1:0:7}" \
                >/dev/null || true
            done

jobs:
  android-ci:
    executor: android-machine
    steps:
      - checkout

      - run:
          name: Prepare Android toolchain
          command: |
            set -euo pipefail
            chmod +x gradlew
            java -version
            ./gradlew --version
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;35.0.0" \
              "ndk;27.0.12077973" \
              "cmake;3.22.1"
            git submodule update --init --recursive --depth 1 || true
            mkdir -p ci-logs /tmp/omnidev-ci-status
            # Cap JVM heap per daemon to fit within large.gen2 (15 GB); gradle.properties requests 6 GB which OOMs on medium.gen2.
            printf 'GRADLE_OPTS=-Xmx3g -Dfile.encoding=UTF-8\nKOTLIN_DAEMON_JVM_OPTIONS=-Xmx3g\n' >> "$BASH_ENV"

      - restore_cache:
          keys:
            - gradle-v4-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}
            - gradle-v4-

      - run:
          name: Lint all debug flavors
          command: |
            set +e
            set -o pipefail
            ./gradlew --no-daemon --max-workers 1 \
              :app:lintLiteDebug \
              :app:lintNormDebug \
              :app:lintProDebug \
              :app:lintOemDebug \
              :app:lintAdminDebug \
              --continue 2>&1 | tee ci-logs/lint.log
            RC=${PIPESTATUS[0]}
            echo "$RC" > /tmp/omnidev-ci-status/lint
            echo "LINT_EXIT_CODE=$RC"
            exit 0

      - send-zip-to-telegram:
          label: "Lint reports ZIP"
          archive_name: "omnidev-lint"
          paths: |
            ci-logs/lint.log
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml

      - run:
          name: Compile and run unit tests
          command: |
            set +e
            set -o pipefail
            ./gradlew --no-daemon --max-workers 1 \
              :app:compileLiteDebugKotlin :app:testLiteDebugUnitTest \
              :app:compileNormDebugKotlin :app:testNormDebugUnitTest \
              :app:compileProDebugKotlin :app:testProDebugUnitTest \
              :app:compileOemDebugKotlin :app:testOemDebugUnitTest \
              :app:compileAdminDebugKotlin :app:testAdminDebugUnitTest \
              --continue 2>&1 | tee ci-logs/tests.log
            RC=${PIPESTATUS[0]}
            echo "$RC" > /tmp/omnidev-ci-status/tests
            echo "TESTS_EXIT_CODE=$RC"
            exit 0

      - store_test_results:
          path: app/build/test-results

      - send-zip-to-telegram:
          label: "Unit tests ZIP"
          archive_name: "omnidev-tests"
          paths: |
            ci-logs/tests.log
            app/build/test-results/**/*.xml
            app/build/reports/tests/**/*.html

      - run:
          name: Build all debug APKs
          command: |
            set +e
            set -o pipefail
            ./gradlew --no-daemon --max-workers 1 \
              :app:assembleLiteDebug \
              :app:assembleNormDebug \
              :app:assembleProDebug \
              :app:assembleOemDebug \
              :app:assembleAdminDebug \
              --continue 2>&1 | tee ci-logs/debug-build.log
            RC=${PIPESTATUS[0]}
            echo "$RC" > /tmp/omnidev-ci-status/debug
            echo "DEBUG_EXIT_CODE=$RC"
            exit 0

      - send-debug-apks-as-zips

      - send-zip-to-telegram:
          label: "Debug build log ZIP"
          archive_name: "omnidev-debug-log"
          paths: |
            ci-logs/debug-build.log

      - run:
          name: Build Admin release APK only
          command: |
            set +e
            set -o pipefail
            ./gradlew --no-daemon --max-workers 1 \
              :app:assembleAdminRelease \
              --continue 2>&1 | tee ci-logs/release-build.log
            RC=${PIPESTATUS[0]}
            echo "$RC" > /tmp/omnidev-ci-status/release
            echo "RELEASE_EXIT_CODE=$RC"
            exit 0

      - send-admin-release-apk

      - send-zip-to-telegram:
          label: "Admin release build log ZIP"
          archive_name: "omnidev-admin-release-log"
          paths: |
            ci-logs/release-build.log

      - store_artifacts:
          path: app/build/outputs/apk
          destination: apk-output

      - store_artifacts:
          path: ci-logs
          destination: ci-logs

      - save_cache:
          key: gradle-v4-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Final CI status
          when: always
          command: |
            set +e
            FAILED=0
            SUMMARY=""

            for STAGE in lint tests debug release; do
              FILE="/tmp/omnidev-ci-status/$STAGE"
              RC=99
              [ -f "$FILE" ] && RC=$(cat "$FILE")
              SUMMARY="${SUMMARY}${STAGE}=${RC} "
              if [ "$RC" -ne 0 ]; then
                FAILED=1
              fi
            done

            echo "============================================================"
            echo "OMNIDEV CI STATUS: ${SUMMARY}"
            echo "============================================================"

            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
              curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="1100444932" \
                --data-urlencode "text=OmniDev CircleCI summary | ${CIRCLE_BRANCH:-unknown} | ${SUMMARY}" \
                >/dev/null || true
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "One or more CI stages failed. Check the Telegram ZIP diagnostics or CircleCI ci-logs artifact for the exact Gradle error."
              exit 1
            fi

            echo "All OmniDev CI stages passed."

workflows:
  omnidev-ci:
    jobs:
      - android-ci
