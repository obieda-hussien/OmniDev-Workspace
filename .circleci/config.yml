version: 2.1

orbs:
  android: circleci/android@3.1.0

executors:
  android-machine:
    machine:
      image: android:2024.11.1
    resource_class: medium

commands:
  prepare-project:
    steps:
      - checkout
      - run:
          name: Prepare Gradle
          command: |
            chmod +x gradlew
            java -version
            ./gradlew --version

  send-files-to-telegram:
    parameters:
      paths:
        type: string
      label:
        type: string
        default: "CircleCI artifact"
    steps:
      - run:
          name: Send complete files to Telegram
          when: always
          command: |
            set +e
            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "TELEGRAM_BOT_TOKEN is not configured in CircleCI Project Settings; skipping Telegram upload."
              exit 0
            fi

            CHAT_ID="1100444932"
            LABEL='<< parameters.label >>'
            FOUND=0

            send_file() {
              FILE="$1"
              [ -f "$FILE" ] || return 0
              FOUND=1
              SIZE=$(wc -c < "$FILE" | tr -d ' ')
              NAME=$(basename "$FILE")

              # Telegram Bot API currently accepts sendDocument uploads up to 50 MB.
              # The user explicitly requested no splitting/chunking, so oversized files are skipped intact.
              if [ "$SIZE" -gt 50000000 ]; then
                echo "Skipping $FILE: ${SIZE} bytes exceeds Telegram Bot API 50 MB sendDocument limit; file was NOT split."
                curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="$CHAT_ID" \
                  --data-urlencode "text=⚠️ ${LABEL}: ${NAME} is ${SIZE} bytes and exceeds Telegram Bot API's 50 MB direct-upload limit. It was not split." \
                  >/dev/null || true
                return 0
              fi

              echo "Sending complete file: $FILE (${SIZE} bytes)"
              curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="$CHAT_ID" \
                -F document=@"$FILE" \
                -F "caption=${LABEL} | ${CIRCLE_PROJECT_REPONAME:-OmniDev-Workspace} | ${CIRCLE_BRANCH:-unknown} | build ${CIRCLE_BUILD_NUM:-unknown}" \
                >/dev/null || true
            }

            while IFS= read -r PATTERN; do
              [ -n "$PATTERN" ] || continue
              while IFS= read -r FILE; do
                [ -n "$FILE" ] && send_file "$FILE"
              done < <(find . -path "./.git" -prune -o -type f -path "$PATTERN" -print 2>/dev/null)
            done <<'PATTERNS'
            << parameters.paths >>
            PATTERNS

            if [ "$FOUND" -eq 0 ]; then
              echo "No matching files found for Telegram upload."
            fi

jobs:
  quality:
    executor: android-machine
    steps:
      - prepare-project
      - run:
          name: Lint all debug flavors
          command: |
            ./gradlew --no-daemon --max-workers 1 \
              :app:lintLiteDebug \
              :app:lintNormDebug \
              :app:lintProDebug \
              :app:lintOemDebug \
              :app:lintAdminDebug \
              --continue
      - store_artifacts:
          path: app/build/reports
          destination: quality-reports
      - send-files-to-telegram:
          label: "Lint report"
          paths: |
            ./app/build/reports/lint-results*.html
            ./app/build/reports/lint-results*.xml

  test:
    executor: android-machine
    steps:
      - prepare-project
      - run:
          name: Compile and run unit tests
          command: |
            ./gradlew --no-daemon --max-workers 1 \
              :app:compileLiteDebugKotlin :app:testLiteDebugUnitTest \
              :app:compileNormDebugKotlin :app:testNormDebugUnitTest \
              :app:compileProDebugKotlin :app:testProDebugUnitTest \
              :app:compileOemDebugKotlin :app:testOemDebugUnitTest \
              :app:compileAdminDebugKotlin :app:testAdminDebugUnitTest \
              --continue
      - store_test_results:
          path: app/build/test-results
      - store_artifacts:
          path: app/build/reports/tests
          destination: unit-tests
      - send-files-to-telegram:
          label: "Unit test report"
          paths: |
            ./app/build/reports/tests/**/*.html
            ./app/build/test-results/**/*.xml

  build-debug:
    executor: android-machine
    steps:
      - prepare-project
      - run:
          name: Build all debug APKs
          command: |
            ./gradlew --no-daemon --max-workers 1 \
              :app:assembleLiteDebug \
              :app:assembleNormDebug \
              :app:assembleProDebug \
              :app:assembleOemDebug \
              :app:assembleAdminDebug
      - store_artifacts:
          path: app/build/outputs/apk
          destination: debug-apks
      - send-files-to-telegram:
          label: "Debug APK"
          paths: |
            ./app/build/outputs/apk/*/debug/*.apk

  build-release:
    executor: android-machine
    steps:
      - prepare-project
      - run:
          name: Build unsigned release APKs
          command: |
            ./gradlew --no-daemon --max-workers 1 \
              :app:assembleLiteRelease \
              :app:assembleNormRelease \
              :app:assembleProRelease \
              :app:assembleOemRelease \
              :app:assembleAdminRelease
      - store_artifacts:
          path: app/build/outputs/apk
          destination: release-apks
      - send-files-to-telegram:
          label: "Release APK"
          paths: |
            ./app/build/outputs/apk/*/release/*.apk

workflows:
  omnidev-ci:
    jobs:
      - quality
      - test:
          requires:
            - quality
      - build-debug:
          requires:
            - test
      - build-release:
          requires:
            - test
